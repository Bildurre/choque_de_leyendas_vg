<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
  <!-- Main parchment body (solid fill) -->
  <rect x="22" y="14" width="276" height="192" fill="#e8c878"/>

  <!-- Subtle parchment shading lines -->
  <line x1="40" y1="50" x2="280" y2="50" stroke="#dbb860" stroke-width="0.5" opacity="0.4"/>
  <line x1="40" y1="90" x2="280" y2="90" stroke="#dbb860" stroke-width="0.5" opacity="0.3"/>
  <line x1="40" y1="130" x2="280" y2="130" stroke="#dbb860" stroke-width="0.5" opacity="0.4"/>
  <line x1="40" y1="170" x2="280" y2="170" stroke="#dbb860" stroke-width="0.5" opacity="0.3"/>

  <!-- Top paper curl -->
  <path d="M28 18 Q160 6 292 18" fill="#f0d890" stroke="#d4b060" stroke-width="1"/>
  <rect x="28" y="14" width="264" height="6" fill="#f0d890" opacity="0.5"/>

  <!-- Bottom paper curl -->
  <path d="M28 202 Q160 214 292 202" fill="#dbb860" stroke="#d4b060" stroke-width="1"/>
  <rect x="28" y="200" width="264" height="6" fill="#dbb860" opacity="0.5"/>

  <!-- Left roll - outer shadow -->
  <rect x="6" y="6" width="26" height="208" rx="13" fill="#b89848"/>
  <!-- Left roll - main body -->
  <rect x="8" y="6" width="22" height="208" rx="11" fill="#d4b060"/>
  <!-- Left roll - highlight -->
  <rect x="14" y="6" width="10" height="208" rx="5" fill="#dfc068"/>
  <!-- Left roll - center shine -->
  <rect x="18" y="6" width="3" height="208" rx="1.5" fill="#ebd480" opacity="0.6"/>

  <!-- Right roll - outer shadow -->
  <rect x="288" y="6" width="26" height="208" rx="13" fill="#b89848"/>
  <!-- Right roll - main body -->
  <rect x="290" y="6" width="22" height="208" rx="11" fill="#d4b060"/>
  <!-- Right roll - highlight -->
  <rect x="296" y="6" width="10" height="208" rx="5" fill="#dfc068"/>
  <!-- Right roll - center shine -->
  <rect x="299" y="6" width="3" height="208" rx="1.5" fill="#ebd480" opacity="0.6"/>

  <!-- Roll end caps - top -->
  <ellipse cx="19" cy="8" rx="13" ry="4" fill="#c4a050"/>
  <ellipse cx="301" cy="8" rx="13" ry="4" fill="#c4a050"/>

  <!-- Roll end caps - bottom -->
  <ellipse cx="19" cy="212" rx="13" ry="4" fill="#c4a050"/>
  <ellipse cx="301" cy="212" rx="13" ry="4" fill="#c4a050"/>

  <!-- Paper-to-roll connection shadows -->
  <rect x="28" y="14" width="4" height="192" fill="#c4a050" opacity="0.3"/>
  <rect x="288" y="14" width="4" height="192" fill="#c4a050" opacity="0.3"/>
</svg>
